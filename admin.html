<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Best Wire Rope</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head><body><main class="admin"><div id="login" class="admin-panel"><span class="eyebrow">Private admin</span><h1>Best Wire Rope Admin</h1><p>Sign in to manage products and customer solution stories.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn primary" id="loginBtn">Sign in</button><p id="loginMsg"></p></div><div id="dashboard" class="hidden"><div class="admin-panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><span class="eyebrow">Content manager</span><h1>Website dashboard</h1></div><button class="btn" id="logoutBtn">Log out</button></div><p id="msg"></p></div><div class="admin-panel"><h2>Add product</h2><div class="admin-row"><input id="pName" placeholder="Product name"><input id="pSlug" placeholder="Slug, e.g. wire-rope"></div><textarea id="pShort" placeholder="Short description"></textarea><textarea id="pDesc" placeholder="Full description"></textarea><label><input id="pPub" type="checkbox" checked> Publish</label><br><input id="pFiles" type="file" multiple accept="image/*"><button class="btn primary" id="addProduct">Save product</button></div><div class="admin-panel"><h2>Add customer solution</h2><input id="sTitle" placeholder="Title"><input id="sSlug" placeholder="Slug"><textarea id="sProblem" placeholder="Customer problem"></textarea><textarea id="sSolution" placeholder="How you solved it"></textarea><input id="sProducts" placeholder="Products used / considered"><label><input id="sPub" type="checkbox" checked> Publish</label><br><input id="sFiles" type="file" multiple accept="image/*"><button class="btn primary" id="addSolution">Save solution</button></div><div class="admin-panel"><h2>Existing products</h2><div id="productList" class="admin-list"></div></div><div class="admin-panel"><h2>Existing solutions</h2><div id="solutionList" class="admin-list"></div></div></div></main><script>const cfg=window.BWR_CONFIG;const client=cfg&&cfg.supabaseUrl&&cfg.supabaseUrl.startsWith('http')?supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;let current=null;const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t}async function init(){if(!client){$('loginMsg').textContent='Add Supabase URL and publishable key in assets/config.js first.';return}const {data}=await client.auth.getSession();if(data.session){current=data.session;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load()}client.auth.onAuthStateChange((e,s)=>{if(s){current=s;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}})}$('loginBtn').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'Signed in.'};$('logoutBtn').onclick=()=>client.auth.signOut();async function editProduct(id){const {data}=await client.from('products').select('*').eq('id',id).single();if(!data)return;const name=prompt('Product name',data.name);if(name===null)return;const short=prompt('Short description',data.short_description||'');if(short===null)return;const desc=prompt('Full description',data.description||'');if(desc===null)return;const {error}=await client.from('products').update({name,short_description:short,description:desc}).eq('id',id);msg(error?error.message:'Product updated.');load()}async function toggleProduct(id,p){const {error}=await client.from('products').update({published:!p}).eq('id',id);msg(error?error.message:'Product status updated.');load()}async function deleteProduct(id){if(!confirm('Delete this product?'))return;const {error}=await client.from('products').delete().eq('id',id);msg(error?error.message:'Product deleted.');load()}async function editSolution(id){const {data}=await client.from('customer_solutions').select('*').eq('id',id).single();if(!data)return;const title=prompt('Title',data.title);if(title===null)return;const problem=prompt('Customer problem',data.problem||'');if(problem===null)return;const solution=prompt('Solution',data.solution||'');if(solution===null)return;const products=prompt('Products',data.products||'');if(products===null)return;const {error}=await client.from('customer_solutions').update({title,problem,solution,products}).eq('id',id);msg(error?error.message:'Solution updated.');load()}async function toggleSolution(id,p){const {error}=await client.from('customer_solutions').update({published:!p}).eq('id',id);msg(error?error.message:'Solution status updated.');load()}async function deleteSolution(id){if(!confirm('Delete this solution?'))return;const {error}=await client.from('customer_solutions').delete().eq('id',id);msg(error?error.message:'Solution deleted.');load()}async function load(){const p=await client.from('products').select('*').order('created_at',{ascending:false});$('productList').innerHTML=(p.data||[]).map(x=>`<div class="admin-item"><span><strong>${x.name}</strong><br><small>${x.slug}</small></span><span><span><span class="status">${x.published?'Published':'Draft'}</span> <button class="btn" onclick="editSolution('${x.id}')">Edit</button> <button class="btn" onclick="toggleSolution('${x.id}',${x.published})">${x.published?'Unpublish':'Publish'}</button> <button class="btn" onclick="deleteSolution('${x.id}')">Delete</button></span> <button class="btn" onclick="editProduct('${x.id}')">Edit</button> <button class="btn" onclick="toggleProduct('${x.id}',${x.published})">${x.published?'Unpublish':'Publish'}</button> <button class="btn" onclick="deleteProduct('${x.id}')">Delete</button></span></div>`).join('')||'<p>No products yet.</p>';const s=await client.from('customer_solutions').select('*').order('created_at',{ascending:false});$('solutionList').innerHTML=(s.data||[]).map(x=>`<div class="admin-item"><span><strong>${x.title}</strong><br><small>${x.slug}</small></span><span class="status">${x.published?'Published':'Draft'}</span></div>`).join('')||'<p>No solutions yet.</p>'}async function uploadFiles(files,folder){const out=[];for(const f of files){const safe=f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');const path=`${folder}/${crypto.randomUUID()}-${safe}`;const {error}=await client.storage.from(cfg.storageBucket).upload(path,f,{upsert:false});if(error)throw error;out.push(path)}return out}$('addProduct').onclick=async()=>{try{msg('Saving product...');const slug=$('pSlug').value.trim();const {data,error}=await client.from('products').insert({name:$('pName').value.trim(),slug,short_description:$('pShort').value.trim(),description:$('pDesc').value.trim(),published:$('pPub').checked}).select().single();if(error)throw error;const paths=await uploadFiles($('pFiles').files,`products/${data.id}`);if(paths.length)await client.from('product_images').insert(paths.map((storage_path,i)=>({product_id:data.id,storage_path,sort_order:i})));msg('Product saved.');load()}catch(e){msg(e.message)}};$('addSolution').onclick=async()=>{try{msg('Saving solution...');const {data,error}=await client.from('customer_solutions').insert({title:$('sTitle').value.trim(),slug:$('sSlug').value.trim(),problem:$('sProblem').value.trim(),solution:$('sSolution').value.trim(),products:$('sProducts').value.trim(),published:$('sPub').checked}).select().single();if(error)throw error;const paths=await uploadFiles($('sFiles').files,`solutions/${data.id}`);if(paths.length)await client.from('solution_images').insert(paths.map((storage_path,i)=>({solution_id:data.id,storage_path,sort_order:i})));msg('Solution saved.');load()}catch(e){msg(e.message)}};init();</script></body></html>
